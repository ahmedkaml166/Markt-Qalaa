<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة قلعة سكر التجارية</title>
  <meta name="theme-color" content="#1d4ed8">
  <link id="app-icon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%231d4ed8'/%3E%3Ctext x='50%25' y='56%25' dominant-baseline='middle' text-anchor='middle' font-size='230' fill='white' font-family='Arial'%3E%D9%82%3C/text%3E%3C/svg%3E">
  <style>
    body{font-family:Tahoma,sans-serif;background:#f1f5f9;margin:0;padding:0 0 70px;direction:rtl}
    header{background:#1d4ed8;color:#fff;text-align:center;padding:16px 10px}
    header h1{margin:0;font-size:21px}
    .points-bar{background:#fef3c7;color:#92400e;text-align:center;padding:8px;font-weight:bold;font-size:13px}
    .cats-bar{display:flex;flex-wrap:wrap;gap:6px;max-width:1300px;margin:12px auto 8px;padding:0 15px;justify-content:center}
    .cat-btn{padding:8px 12px;border:1px solid #cbd5e1;background:#fff;color:#0f172a;border-radius:20px;font-size:11px;font-weight:bold;cursor:pointer}
    .cat-btn.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
    .search-container{text-align:center;margin:8px 15px 12px}
    #searchBox{width:100%;max-width:450px;padding:9px 14px;border:1px solid #cbd5e1;border-radius:20px;font-size:13px;box-sizing:border-box}
    .section-title{max-width:1300px;margin:14px auto 6px;padding:0 15px;font-size:15px;font-weight:bold;color:#0f172a}
    .top-products-scroll{display:flex;overflow-x:auto;gap:10px;max-width:1300px;margin:0 auto 16px;padding:8px 15px}
    .mini-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px;min-width:120px;text-align:center;flex-shrink:0}
    .media-box{background:#e2e8f0;height:78px;border-radius:5px;overflow:hidden;margin-bottom:5px;position:relative}
    .media-box img,.media-box video,.media-box iframe{width:100%;height:100%;object-fit:cover;border:none;display:block}
    .tt-box{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:4px;font-size:9px;text-align:center;padding:3px;box-sizing:border-box}
    .tt-link{background:#111827;color:#fff;text-decoration:none;padding:3px 7px;border-radius:4px;font-weight:bold;font-size:9px}
    .mini-title{font-size:11px;font-weight:bold;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mini-price{font-size:10px;color:#15803d;font-weight:bold;margin:2px 0 4px}
    .mini-btn{display:block;background:#16a34a;color:#fff;text-decoration:none;padding:4px;border-radius:4px;font-size:10px;font-weight:bold}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-width:1300px;margin:0 auto;padding:0 15px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px;text-align:center;position:relative}
    .num{position:absolute;top:5px;right:5px;background:#1d4ed8;color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;font-weight:bold;z-index:2}
    .card h3{margin:2px 0;font-size:11px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-tag{font-size:9px;color:#475569;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .btn{display:inline-block;padding:4px 6px;border-radius:4px;text-decoration:none;font-size:10px;font-weight:bold;border:none;cursor:pointer;margin:2px 1px}
    .open{background:#1d4ed8;color:#fff}
    .whatsapp{background:#16a34a;color:#fff}
    .share{background:#ea580c;color:#fff}
    .admin-box{background:#fff;border:2px dashed #1d4ed8;border-radius:8px;padding:12px;margin:12px auto;max-width:850px}
    .admin-box input,.admin-box select{padding:6px;margin:3px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px}
    .save{background:#1d4ed8;color:#fff}
    .del{background:#dc2626;color:#fff}
    #shopSec{display:none;max-width:1300px;margin:0 auto;padding:0 15px}
    .back-btn{background:#334155;color:#fff;padding:7px 14px;border:none;border-radius:5px;font-size:12px;font-weight:bold;cursor:pointer;margin-bottom:10px}
    .item-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px;text-align:center}
    .item-card h4{margin:3px 0;font-size:11px;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .price{color:#15803d;font-weight:bold;font-size:10px;margin-bottom:4px}
    #zoomModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;align-items:center;justify-content:center;flex-direction:column;padding:15px}
    #zoomModal img{max-width:95%;max-height:80vh;border-radius:8px;object-fit:contain}
    #zoomCap{color:#fff;margin-top:10px;font-size:13px;font-weight:bold;text-align:center}
    #zoomClose{position:absolute;top:15px;left:20px;background:#dc2626;color:#fff;border:none;border-radius:6px;padding:7px 13px;font-size:13px;font-weight:bold;cursor:pointer}
    #shareModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center}
    #shareBox{background:#fff;padding:18px;border-radius:10px;max-width:340px;width:90%;text-align:center}
    #shareBox textarea{width:100%;height:70px;margin:8px 0;padding:6px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px}
    #loadMoreWrap{text-align:center;margin:18px 0}
    #loadMoreBtn{background:#0f172a;color:#fff;border:none;padding:9px 20px;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <header>
    <h1>منصة قلعة سكر التجارية</h1>
  </header>
  <div class="points-bar">نقاطك: <span id="pts">0</span> نقطة (تحصل على +10 نقاط عند مشاركة أي محل أو منتج)</div>
  <div id="topAdminBox" class="admin-box" style="display:none">
    <b>إعدادات الإدارة العامة:</b><br>
    <input id="newCatInput" placeholder="اسم قسم جديد (مثلاً: إلكترونيات)">
    <button class="btn save" onclick="addCategory()">إضافة قسم</button>
    <button class="btn share" onclick="exportBackup()">تصدير نسخة احتياطية</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)">
    <button class="btn open" onclick="document.getElementById('importFile').click()">استيراد نسخة</button>
    <button class="btn save" onclick="syncAllToCloud()">رفع الكل للسحابة</button>
  </div>
  <div id="homeSec">
    <div id="catsBar" class="cats-bar"></div>
    <div class="search-container">
      <input id="searchBox" placeholder="ابحث عن اسم محل أو منتج..." oninput="renderHome()">
    </div>
    <div class="section-title">أبرز المنتجات والعروض</div>
    <div id="topProducts" class="top-products-scroll"></div>
    <div class="section-title">جميع المحلات (100 محل)</div>
    <div id="shopsGrid" class="grid"></div>
    <div id="loadMoreWrap" style="display:none">
      <button id="loadMoreBtn" onclick="showMoreShops()">عرض المزيد من المحلات</button>
    </div>
  </div>
  <div id="shopSec">
    <button class="back-btn" onclick="goHome()">العودة إلى المحلات</button>
    <h2 id="shopTitle"></h2>
    <div id="adminBox" class="admin-box" style="display:none">
      <b>لوحة تحكم المحل (تظهر للمدير فقط):</b><br>
      <input id="editShopName" placeholder="اسم المحل">
      <input id="editShopPhone" placeholder="رقم واتساب المحل (مثال 964780...)">
      <select id="editShopCat"></select>
      <input type="file" id="editShopCoverFile" accept="image/*,video/*" onchange="handleMediaFile(this,function(v){document.getElementById('editShopCover').value=v})">
      <input id="editShopCover" placeholder="رابط صورة/فيديو غلاف المحل">
      <button class="btn save" onclick="saveShopInfo()">حفظ المحل</button><br><br>
      <b>فيديو قطعة (1-50):</b>
      <input id="vidItemNum" type="number" min="1" max="50" value="1" style="width:65px">
      <input id="vidItemUrl" placeholder="رابط يوتيوب أو تيك توك أو ملف">
      <input type="file" id="vidItemFile" accept="video/*" onchange="handleMediaFile(this,function(v){document.getElementById('vidItemUrl').value=v})">
      <button class="btn save" onclick="saveItemVideo()">حفظ الفيديو</button>
      <button class="btn del" onclick="clearItemVideo()">حذف الفيديو</button><br><br>
      <b>إضافة / تعديل قطعة (1-50):</b>
      <input id="itemNum" type="number" min="1" max="50" value="1" style="width:65px">
      <input id="itemName" placeholder="اسم القطعة">
      <input id="itemPrice" placeholder="السعر">
      <input type="file" id="itemImgFile" accept="image/*" onchange="handleMediaFile(this,function(v){document.getElementById('itemImg').value=v})">
      <input id="itemImg" placeholder="رابط صورة القطعة">
      <label><input type="checkbox" id="itemFeatured"> عرض في الأعلى</label>
      <button class="btn save" onclick="saveItem()">حفظ القطعة</button>
      <button class="btn del" onclick="deleteItem()">حذف القطعة</button>
    </div>
    <div id="itemsGrid" class="grid"></div>
  </div>
  <div id="zoomModal" onclick="if(event.target.id==='zoomModal')closeZoom()">
    <button id="zoomClose" onclick="closeZoom()">إغلاق ✕</button>
    <img id="zoomImg" src="" alt="">
    <div id="zoomCap"></div>
  </div>
  <div id="shareModal">
    <div id="shareBox">
      <b>مشاركة وكسب +10 نقاط</b>
      <textarea id="shareText" readonly></textarea>
      <button class="btn whatsapp" onclick="shareVia('wa')">واتساب</button>
      <button class="btn open" onclick="shareVia('tg')">تليجرام</button>
      <button class="btn share" onclick="copyShare()">نسخ النص</button>
      <button class="btn del" onclick="closeModal()">إغلاق</button>
    </div>
  </div><script>
    var FIREBASE_DB_URL = "https://markt-qalaa-default-rtdb.firebaseio.com/Markt-Qalaa.json";
    var defaultPhone = "9647801787360", adminPass = "1234";
    var defaultCats = ["الكل", "منزل ومكتبات", "أزياء وملابس", "عطور وعناية", "خدمات وأخرى"];
    var categories = defaultCats.slice();
    var shopNames = {1:"مكتبة الفرات",2:"متجر الأزياء",3:"عطارة الشفاء",4:"مجوهرات القلعة",5:"سوبرماركت البركة"};
    var shopPhones = {1:"9647800000001",2:"9647800000002",3:"9647800000003",4:"9647800000004",5:"9647800000005"};
    var shopCats = {};
    for (var n = 6; n <= 100; n++) { shopNames[n] = "محل " + n; shopPhones[n] = "96478000000" + (n < 10 ? "0" + n : n); }
    for (var c = 1; c <= 100; c++) { shopCats[c] = "خدمات وأخرى"; }
    shopCats[1] = "منزل ومكتبات"; shopCats[2] = "أزياء وملابس"; shopCats[3] = "عطور وعناية"; shopCats[5] = "منزل ومكتبات";
    var shopCovers = {}, itemVideos = {}, customProds = {}, topCustom = {};
    var curShop = 1, curCat = "الكل", isAdmin = false, points = 0, lastShareText = "", shareRewarded = false, visibleShops = 100, idb = null;

    if (window.location.search.indexOf("admin=1") !== -1 && prompt("أدخل رمز الإدارة:") === adminPass) isAdmin = true;
    document.getElementById("topAdminBox").style.display = isAdmin ? "block" : "none";
    document.getElementById("adminBox").style.display = isAdmin ? "block" : "none";

    function applyLoadedData(d) {
      if (!d) return;
      if (typeof d.q_pts !== "undefined") { points = parseInt(d.q_pts || "0", 10) || 0; document.getElementById("pts").textContent = points; }
      if (Array.isArray(d.categories) && d.categories.length) categories = d.categories;
      ["shopNames","shopPhones","shopCats","shopCovers","itemVideos","customProds","topCustom"].forEach(function(k){
        if (d[k]) window[k] = d[k];
        if (d["q_" + k]) window[k] = d["q_" + k];
      });
    }

    try {
      points = parseInt(localStorage.getItem("q_pts") || "0", 10) || 0;
      document.getElementById("pts").textContent = points;
      var savedCats = JSON.parse(localStorage.getItem("q_cats") || "null");
      if (Array.isArray(savedCats) && savedCats.length) categories = savedCats;
      applyLoadedData({
        q_pts: points,
        q_shopNames: JSON.parse(localStorage.getItem("q_shop_names") || "{}"),
        q_shopPhones: JSON.parse(localStorage.getItem("q_shop_phones") || "{}"),
        q_shopCats: JSON.parse(localStorage.getItem("q_shop_cats") || "{}"),
        q_shopCovers: JSON.parse(localStorage.getItem("q_shop_covers") || "{}") || {},
        q_itemVideos: JSON.parse(localStorage.getItem("q_item_vids") || "{}") || {},
        q_customProds: JSON.parse(localStorage.getItem("q_prods") || "{}") || {},
        q_topCustom: JSON.parse(localStorage.getItem("q_top_prods") || "{}") || {}
      });
    } catch (e) {}

    function saveLocalState() {
      try {
        localStorage.setItem("q_pts", String(points));
        localStorage.setItem("q_cats", JSON.stringify(categories));
        localStorage.setItem("q_shop_names", JSON.stringify(shopNames));
        localStorage.setItem("q_shop_phones", JSON.stringify(shopPhones));
        localStorage.setItem("q_shop_cats", JSON.stringify(shopCats));
        localStorage.setItem("q_shop_covers", JSON.stringify(shopCovers));
        localStorage.setItem("q_item_vids", JSON.stringify(itemVideos));
        localStorage.setItem("q_prods", JSON.stringify(customProds));
        localStorage.setItem("q_top_prods", JSON.stringify(topCustom));
      } catch (e) {}
    }

    function initBigStorage() {
      if (!window.indexedDB) return;
      var req = indexedDB.open("QalaaSukkarDB", 1);
      req.onupgradeneeded = function(ev) {
        if (!ev.target.result.objectStoreNames.contains("store")) ev.target.result.createObjectStore("store");
      };
      req.onsuccess = function(ev) {
        idb = ev.target.result;
        try {
          var st = idb.transaction("store", "readonly").objectStore("store");
          var keys = ["q_pts","q_shop_names","q_shop_phones","q_shop_cats","q_shop_covers","q_item_vids","q_prods","q_top_prods"];
          var loaded = {}, done = 0;
          keys.forEach(function(k) {
            var g = st.get(k);
            g.onsuccess = function() {
              if (typeof g.result !== "undefined") loaded[k] = g.result;
              if (++done === keys.length && Object.keys(loaded).length) {
                applyLoadedData(loaded);
                renderCats();
                renderHome();
                if (document.getElementById("shopSec").style.display === "block") drawItems(curShop);
              }
            };
          });
        } catch (err) {}
      };
    }

    function loadFromCloud() {
      if (!FIREBASE_DB_URL) return;
      fetch(FIREBASE_DB_URL)
        .then(function(r) { return r.json(); })
        .then(function(rec) {
          if (!rec || typeof rec !== "object" || !Object.keys(rec).length) return;
          applyLoadedData(rec);
          saveLocalState();
          renderCats();
          renderHome();
          if (document.getElementById("shopSec").style.display === "block") drawItems(curShop);
        })
        .catch(function() {});
    }

    function syncAllToCloud() {
      if (!FIREBASE_DB_URL) return;
      var payload = {
        categories: categories,
        shopNames: shopNames,
        shopPhones: shopPhones,
        shopCats: shopCats,
        shopCovers: shopCovers,
        itemVideos: itemVideos,
        customProds: customProds,
        topCustom: topCustom
      };
      fetch(FIREBASE_DB_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(function(r) {
        if (!r.ok) alert("تنبيه: لم يتم الرفع إلى قاعدة البيانات.");
        else alert("تم الحفظ والمزامنة في قاعدة البيانات بنجاح.");
      })
      .catch(function() {
        alert("تنبيه: تعذر الاتصال بقاعدة البيانات.");
      });
    }

    function handleMediaFile(input, cb) {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(e) { cb(e.target.result); };
      reader.readAsDataURL(f);
    }

    function openZoom(src, cap) {
      if (!src) return;
      document.getElementById("zoomImg").src = src;
      document.getElementById("zoomCap").textContent = cap || "";
      document.getElementById("zoomModal").style.display = "flex";
    }

    function closeZoom() {
      document.getElementById("zoomModal").style.display = "none";
      document.getElementById("zoomImg").src = "";
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") { closeZoom(); closeModal(); }
    });

    function getTikTokId(v) {
      if (!v) return "";
      var s = v.trim();
      if (s.indexOf("tt:") === 0) return s.slice(3).trim();
      var m = s.match(/tiktok\.com\/(?:@[^/?#]+\/video\/|v\/|embed\/v2\/|embed\/)(\d+)/i);
      return m ? m[1] : "";
    }

    function isTikTokUrl(v) {
      if (!v) return false;
      var s = v.trim().toLowerCase();
      return s.indexOf("tt:") === 0 || s.indexOf("tiktok.com") !== -1 || s.indexOf("vm.tiktok.com") !== -1 || s.indexOf("vt.tiktok.com") !== -1;
    }

    function makeMedia(imgSrc, vidSrc, cap) {
      if (vidSrc && vidSrc.indexOf("yt:") === 0) {
        var ifr = document.createElement("iframe");
        ifr.src = "https://www.youtube.com/embed/" + vidSrc.slice(3);
        ifr.allowFullscreen = true;
        return ifr;
      }
      if (vidSrc && isTikTokUrl(vidSrc)) {
        var ttId = getTikTokId(vidSrc);
        if (ttId) {
          var tifr = document.createElement("iframe");
          tifr.src = "https://www.tiktok.com/embed/v2/" + ttId;
          tifr.allow = "encrypted-media; fullscreen";
          tifr.allowFullscreen = true;
          return tifr;
        }
        var box = document.createElement("div");
        box.className = "tt-box";
        var lbl = document.createElement("div");
        lbl.textContent = "فيديو تيك توك";
        var a = document.createElement("a");
        a.className = "tt-link";
        a.target = "_blank";
        a.rel = "noopener";
        a.href = vidSrc.trim().indexOf("tt:") === 0 ? ("https://www.tiktok.com/video/" + vidSrc.slice(3)) : vidSrc.trim();
        a.textContent = "مشاهدة على تيك توك";
        box.appendChild(lbl);
        box.appendChild(a);
        return box;
      }
      if (vidSrc) {
        var vid = document.createElement("video");
        vid.src = vidSrc;
        vid.controls = true;
        vid.muted = true;
        vid.playsInline = true;
        return vid;
      }
      var img = document.createElement("img");
      img.src = imgSrc;
      img.alt = cap;
      img.onerror = function() { img.style.display = "none"; };
      img.onclick = function() { if (img.src && img.style.display !== "none") openZoom(img.src, cap); };
      return img;
    }
  </script><script>
    function renderCats() {
      var bar = document.getElementById("catsBar");
      var sel = document.getElementById("editShopCat");
      bar.innerHTML = "";
      if (sel) sel.innerHTML = "";
      categories.forEach(function(cat) {
        var b = document.createElement("button");
        b.className = "cat-btn" + (curCat === cat ? " active" : "");
        b.textContent = cat;
        b.onclick = function() { curCat = cat; renderCats(); renderHome(); };
        bar.appendChild(b);
        if (sel && cat !== "الكل") {
          var opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          sel.appendChild(opt);
        }
      });
    }

    function addCategory() {
      var val = (document.getElementById("newCatInput").value || "").trim();
      if (!val) return;
      if (categories.indexOf(val) === -1) categories.push(val);
      document.getElementById("newCatInput").value = "";
      saveLocalState();
      renderCats();
      syncAllToCloud();
    }

    function renderTopProducts() {
      var wrap = document.getElementById("topProducts");
      wrap.innerHTML = "";
      var keys = Object.keys(topCustom);
      if (!keys.length) {
        wrap.innerHTML = '<div style="font-size:12px;color:#64748b">لا توجد منتجات مميزة مضافة حالياً.</div>';
        return;
      }
      keys.forEach(function(k) {
        var item = topCustom[k];
        if (!item) return;
        var card = document.createElement("div");
        card.className = "mini-card";
        var box = document.createElement("div");
        box.className = "media-box";
        box.appendChild(makeMedia(item.img || "", item.vid || "", item.name || ""));
        var title = document.createElement("div");
        title.className = "mini-title";
        title.textContent = item.name || "منتج";
        var price = document.createElement("div");
        price.className = "mini-price";
        price.textContent = item.price || "حسب الطلب";
        var btn = document.createElement("a");
        btn.className = "mini-btn";
        btn.target = "_blank";
        btn.href = "https://wa.me/" + (shopPhones[item.shop] || defaultPhone) + "?text=" + encodeURIComponent("مرحباً، أود الاستفسار عن: " + (item.name || ""));
        btn.textContent = "طلب واتساب";
        card.appendChild(box);
        card.appendChild(title);
        card.appendChild(price);
        card.appendChild(btn);
        wrap.appendChild(card);
      });
    }

    function renderHome() {
      renderTopProducts();
      var grid = document.getElementById("shopsGrid");
      var q = (document.getElementById("searchBox").value || "").trim().toLowerCase();
      grid.innerHTML = "";
      var matched = [];
      for (var i = 1; i <= 100; i++) {
        var sName = shopNames[i] || ("محل " + i);
        var sCat = shopCats[i] || "خدمات وأخرى";
        var okCat = (curCat === "الكل" || sCat === curCat);
        var okSearch = !q || sName.toLowerCase().indexOf(q) !== -1 || sCat.toLowerCase().indexOf(q) !== -1;
        if (okCat && okSearch) matched.push(i);
      }
      matched.slice(0, visibleShops).forEach(function(i) {
        var card = document.createElement("div");
        card.className = "card";
        var num = document.createElement("div");
        num.className = "num";
        num.textContent = "#" + i;
        var box = document.createElement("div");
        box.className = "media-box";
        var cov = shopCovers[i] || "";
        box.appendChild(makeMedia(cov, cov && cov.indexOf("data:video") === 0 ? cov : "", shopNames[i]));
        var h3 = document.createElement("h3");
        h3.textContent = shopNames[i] || ("محل " + i);
        var catTag = document.createElement("div");
        catTag.className = "cat-tag";
        catTag.textContent = shopCats[i] || "خدمات وأخرى";
        var openBtn = document.createElement("button");
        openBtn.className = "btn open";
        openBtn.textContent = "دخول";
        openBtn.onclick = function() { openShop(i); };
        var waBtn = document.createElement("a");
        waBtn.className = "btn whatsapp";
        waBtn.target = "_blank";
        waBtn.href = "https://wa.me/" + (shopPhones[i] || defaultPhone);
        waBtn.textContent = "واتساب";
        var shBtn = document.createElement("button");
        shBtn.className = "btn share";
        shBtn.textContent = "مشاركة";
        shBtn.onclick = function() { openShareModal("تصفح " + (shopNames[i] || ("محل " + i)) + " على منصة قلعة سكر التجارية: " + window.location.href); };
        card.appendChild(num);
        card.appendChild(box);
        card.appendChild(h3);
        card.appendChild(catTag);
        card.appendChild(openBtn);
        card.appendChild(waBtn);
        card.appendChild(shBtn);
        grid.appendChild(card);
      });
      document.getElementById("loadMoreWrap").style.display = matched.length > visibleShops ? "block" : "none";
    }

    function showMoreShops() {
      visibleShops += 50;
      renderHome();
    }

    function openShop(id) {
      curShop = id;
      document.getElementById("homeSec").style.display = "none";
      document.getElementById("shopSec").style.display = "block";
      document.getElementById("shopTitle").textContent = shopNames[id] || ("محل " + id);
      document.getElementById("editShopName").value = shopNames[id] || "";
      document.getElementById("editShopPhone").value = shopPhones[id] || defaultPhone;
      document.getElementById("editShopCat").value = shopCats[id] || "خدمات وأخرى";
      document.getElementById("editShopCover").value = shopCovers[id] || "";
      drawItems(id);
      window.scrollTo(0, 0);
    }

    function goHome() {
      document.getElementById("shopSec").style.display = "none";
      document.getElementById("homeSec").style.display = "block";
      renderHome();
    }

    function saveShopInfo() {
      var nameVal = (document.getElementById("editShopName").value || "").trim();
      var phoneVal = (document.getElementById("editShopPhone").value || "").trim();
      var catVal = document.getElementById("editShopCat").value || "خدمات وأخرى";
      var covVal = (document.getElementById("editShopCover").value || "").trim();
      if (nameVal) shopNames[curShop] = nameVal;
      if (phoneVal) shopPhones[curShop] = phoneVal;
      shopCats[curShop] = catVal;
      if (covVal) shopCovers[curShop] = covVal;
      document.getElementById("shopTitle").textContent = shopNames[curShop];
      saveLocalState();
      syncAllToCloud();
    }

    function saveItemVideo() {
      var idx = parseInt(document.getElementById("vidItemNum").value || "1", 10);
      var url = (document.getElementById("vidItemUrl").value || "").trim();
      if (!url) return;
      if (!itemVideos[curShop]) itemVideos[curShop] = {};
      itemVideos[curShop][idx] = url;
      saveLocalState();
      drawItems(curShop);
      syncAllToCloud();
    }

    function clearItemVideo() {
      var idx = parseInt(document.getElementById("vidItemNum").value || "1", 10);
      if (itemVideos[curShop]) delete itemVideos[curShop][idx];
      saveLocalState();
      drawItems(curShop);
      syncAllToCloud();
    }

    function saveItem() {
      var idx = parseInt(document.getElementById("itemNum").value || "1", 10);
      var name = (document.getElementById("itemName").value || "").trim() || ("قطعة " + idx);
      var price = (document.getElementById("itemPrice").value || "").trim() || "حسب الطلب";
      var img = (document.getElementById("itemImg").value || "").trim();
      var feat = document.getElementById("itemFeatured").checked;
      if (!customProds[curShop]) customProds[curShop] = {};
      var vid = (itemVideos[curShop] && itemVideos[curShop][idx]) || "";
      customProds[curShop][idx] = { name: name, price: price, img: img, vid: vid };
      var tKey = curShop + "_" + idx;
      if (feat) topCustom[tKey] = { shop: curShop, num: idx, name: name, price: price, img: img, vid: vid };
      else delete topCustom[tKey];
      saveLocalState();
      drawItems(curShop);
      syncAllToCloud();
    }

    function deleteItem() {
      var idx = parseInt(document.getElementById("itemNum").value || "1", 10);
      if (customProds[curShop]) delete customProds[curShop][idx];
      delete topCustom[curShop + "_" + idx];
      saveLocalState();
      drawItems(curShop);
      syncAllToCloud();
    }

    function drawItems(shopId) {
      var grid = document.getElementById("itemsGrid");
      grid.innerHTML = "";
      var shopItems = customProds[shopId] || {};
      var shopVids = itemVideos[shopId] || {};
      for (var i = 1; i <= 50; i++) {
        var it = shopItems[i] || { name: "قطعة " + i, price: "حسب الطلب", img: "", vid: "" };
        var vid = shopVids[i] || it.vid || "";
        var card = document.createElement("div");
        card.className = "item-card";
        var box = document.createElement("div");
        box.className = "media-box";
        box.appendChild(makeMedia(it.img || "", vid, it.name));
        var h4 = document.createElement("h4");
        h4.textContent = it.name;
        var pr = document.createElement("div");
        pr.className = "price";
        pr.textContent = it.price;
        var wa = document.createElement("a");
        wa.className = "btn whatsapp";
        wa.target = "_blank";
        wa.href = "https://wa.me/" + (shopPhones[shopId] || defaultPhone) + "?text=" + encodeURIComponent("مرحباً، أريد طلب (" + it.name + ") من " + (shopNames[shopId] || ("محل " + shopId)));
        wa.textContent = "طلب واتساب";
        var sh = document.createElement("button");
        sh.className = "btn share";
        sh.textContent = "مشاركة";
        (function(itemTitle, itemPrice) {
          sh.onclick = function() {
            openShareModal("شاهد (" + itemTitle + ") بسعر " + itemPrice + " من " + (shopNames[shopId] || ("محل " + shopId)) + " - " + window.location.href);
          };
        })(it.name, it.price);
        card.appendChild(box);
        card.appendChild(h4);
        card.appendChild(pr);
        card.appendChild(wa);
        card.appendChild(sh);
        grid.appendChild(card);
      }
    }

    function openShareModal(txt) {
      lastShareText = txt;
      shareRewarded = false;
      document.getElementById("shareText").value = txt;
      document.getElementById("shareModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("shareModal").style.display = "none";
    }

    function rewardShare() {
      if (shareRewarded) return;
      shareRewarded = true;
      points += 10;
      document.getElementById("pts").textContent = points;
      saveLocalState();
    }

    function shareVia(platform) {
      rewardShare();
      var enc = encodeURIComponent(lastShareText);
      var url = platform === "wa" ? ("https://wa.me/?text=" + enc) : ("https://t.me/share/url?url=" + encodeURIComponent(window.location.href) + "&text=" + enc);
      window.open(url, "_blank", "noopener");
    }

    function copyShare() {
      rewardShare();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastShareText).catch(function() {});
      }
      alert("تم نسخ النص وإضافة +10 نقاط إلى رصيدك.");
    }

    function exportBackup() {
      var data = {
        categories: categories,
        shopNames: shopNames,
        shopPhones: shopPhones,
        shopCats: shopCats,
        shopCovers: shopCovers,
        itemVideos: itemVideos,
        customProds: customProds,
        topCustom: topCustom
      };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Markt-Qalaa-backup.json";
      a.click();
    }

    function importBackup(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var parsed = JSON.parse(e.target.result);
          applyLoadedData(parsed);
          saveLocalState();
          renderCats();
          renderHome();
          syncAllToCloud();
        } catch (err) {
          alert("ملف النسخة الاحتياطية غير صالح.");
        }
      };
      reader.readAsText(file);
    }

    renderCats();
    renderHome();
    initBigStorage();
    loadFromCloud();
  </script>
</body>
</html>
